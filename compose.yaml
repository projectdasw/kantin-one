services:
  kantin-one:
    build:
      context: .
      dockerfile: Dockerfile

    image: kantin-one:latest

    container_name: kantin-one-app

    restart: unless-stopped

    ports:
      - "192.168.100.75:8081:80"

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    networks:
      - kantin-network

  queue-worker:
    image: kantin-one:latest
    container_name: kantin-one-worker

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - php
      - artisan
      - queue:work
      - database
      - --sleep=3
      - --tries=3
      - --timeout=60
      - --memory=128

    volumes:
      - ./src:/var/www/html

    mem_limit: 192m
    cpus: 0.50

    networks:
      - kantin-network

  redis:
    image: redis:7.4-alpine
    container_name: kantin-one-redis
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru

    mem_limit: 128m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - kantin-network
  
  scheduler:
    image: kantin-one:latest
    container_name: kantin-one-scheduler

    restart: unless-stopped

    working_dir: /var/www/html

    command:
      - php
      - artisan
      - schedule:work

    volumes:
      - ./src:/var/www/html

    mem_limit: 128m
    cpus: 0.25

    networks:
      - kantin-network

networks:
  kantin-network:
    external: true
    name: dasw_backend